<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
    <head>

        <style>
            a{
                text-decoration: none;
            }

        </style>

    </head>

    <body style="margin: 0px;">

        <table
                dir="id=layout_dir"
                width="100%"
                border="0"
                cellspacing="0"
                cellpadding="0"
                style="background-color: #191C19; width: 100%; padding-top: 16px;"
                bgcolor="#191C19">
            <tr>
                <td align="center">

                    <div style="width: 100%; max-width: 700px;">

                        <div style="width: 300px; padding-top: 50px; padding-bottom: 50px">
                            <a href="http://www.crookcatcher.app">
                                <img src="id=logo" style="width: 100%;">
                            </a>
                        </div>

                        <div align="start" style="width: 100%; background-color: #1e251e; border-radius: 22px;">
                            <div style="padding: 32px 32px;">

                                <h1 style="font-weight: 400; font-size: 22px; padding-bottom: 20px; font-family: 'Lato', sans-serif; color: #ffffff; text-align: center">
                                    id=contentTitle
                                </h1>

                                id=pictureSection

                            </div>
                        </div>

                        id=locationSection

                        <hr style="opacity: 0.12; margin-top: 32px;">

                        <!-- Footer bar -->
                        <div
                                style="text-align: center; font-size: 14px; padding: 32px; padding-top: 16px;"
                                align="center">
                            <p style="font-weight: 400; font-family: 'Lato', sans-serif; color: #ffffff">
                                id=footerText
                            </p>
                        </div>

                    </div>
                </td>
            </tr>
        </table>

    </body>
</html>
